<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<base href="https://cdn.jsdelivr.net/gh/cgolden15/Slope-Game@4b8ec69e19989a487bb73a6a697d5de48ea8d433/">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; }
  #gameContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #7dd3fc; font-family: monospace; font-size: 18px; text-align: center; z-index: 10; }
  #loader .bar { width: 240px; height: 10px; background: #16324f; border-radius: 6px; margin: 10px auto 0; overflow: hidden; }
  #loader .bar > div { height: 100%; width: 0%; background: #38bdf8; border-radius: 6px; }
</style>
</head>
<body>
<div id="loader">Slope<div class="bar"><div id="bar"></div></div></div>
<div id="gameContainer"></div>
<script src="TemplateData/unityloader41.js"></script>
<script>
  var bar = document.getElementById("bar");
  var loader = document.getElementById("loader");
  var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
    onProgress: function (g, p) {
      if (bar && p < 1) { bar.style.width = Math.round(p * 100) + "%"; }
      if (loader && p >= 1) { loader.parentNode.removeChild(loader); }
    }
  });
</script>
</body>
</html>
