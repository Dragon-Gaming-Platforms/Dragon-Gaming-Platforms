<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scramjet</title>
</head>
<body>
<div style="position:relative;width:100%;aspect-ratio:100/100;">
  <iframe
    src="https://dragon-gaming-platforms.github.io/scramjet"
    width="100%"
    height="100%"
    style="border:0;overflow:hidden;"
    scrolling="auto"
    frameborder="0"
    name="Scramjet"
    title="Scramjet Proxy Browser"
    referrerpolicy="origin"
    sandbox="allow-top-navigation allow-popups allow-same-origin allow-forms allow-scripts"
    allowfullscreen
    allow="microphone; picture-in-picture; autoplay"
  ></iframe>
</div>
</body>
</html>
