# Simple workflow for deploying static content to GitHub Pages
name: Deploy Dragon Gaming Platforms

on:
  # Runs on pushes targeting the default branch. A merged pull request lands on
  # main as a push event (merge commit, squash and rebase merges alike), so this
  # is what deploys the site after a PR merge - and it always deploys main's
  # real tip rather than a PR's pre-merge preview ref.
  #
  # Note: pushes made with the GITHUB_TOKEN do not trigger other workflows, so
  # UpdateVersion.yml and sync-assets-catalog.yml deliberately deploy Pages
  # themselves instead of relying on this trigger.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Repo plumbing stays in the repository but must not ship to the site.
      # Keep this list in sync with the removal step in sync-assets-catalog.yml.
      - name: Remove non-site files from the deploy tree
        run: rm -rf scripts .github AGENTS.md README.md .gitignore .git
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
