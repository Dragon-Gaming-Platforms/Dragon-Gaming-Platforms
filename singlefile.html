<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Gaming Platforms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* ============================
   CSS RESET & VARIABLES
   ============================ */
*,
*::before,
*::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red-primary: #e60012;
  --red-bright: #ff1a2e;
  --red-glow: #ff0033;
  --red-dark: #8b0000;
  --red-dim: #4a0000;
  --bg-darkest: #050505;
  --bg-dark: #0a0a0a;
  --bg-card: #0d0d0d;
  --bg-card-hover: #141414;
  --border-color: #1a1a1a;
  --text-primary: #f0f0f0;
  --text-secondary: #aaaaaa;
  --text-dim: #666666;
  --font-heading: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
  --t-fast: 0.2s ease;
  --t-med: 0.35s ease;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background-color: var(--bg-darkest);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ---------- Animated BG ---------- */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(139,0,0,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(230,0,18,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(139,0,0,0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,0,51,0.3), transparent),
    radial-gradient(1px 1px at 30% 70%, rgba(255,0,51,0.2), transparent),
    radial-gradient(1px 1px at 50% 40%, rgba(255,26,46,0.3), transparent),
    radial-gradient(1px 1px at 70% 80%, rgba(255,0,51,0.2), transparent),
    radial-gradient(1px 1px at 90% 30%, rgba(255,0,51,0.3), transparent),
    radial-gradient(1px 1px at 15% 90%, rgba(255,26,46,0.2), transparent),
    radial-gradient(1px 1px at 60% 10%, rgba(255,0,51,0.3), transparent),
    radial-gradient(1px 1px at 85% 55%, rgba(255,26,46,0.2), transparent),
    radial-gradient(1px 1px at 45% 60%, rgba(255,0,51,0.2), transparent),
    radial-gradient(1px 1px at 75% 15%, rgba(255,0,51,0.3), transparent);
  animation: particlesFloat 30s linear infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes particlesFloat {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { opacity: 0.8; }
  100% { transform: translateY(-100px); opacity: 0.5; }
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-darkest); }
::-webkit-scrollbar-thumb { background: var(--red-dark); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--red-primary); }

/* ---------- Utility ---------- */
.container { max-width: 1300px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

/* ============================
   NAVBAR
   ============================ */
.navbar {
  position: fixed;
  top: 0; left: 0; width: 100%;
  z-index: 1000;
  background: rgba(5,5,5,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  transition: var(--t-med);
}
.navbar.scrolled {
  border-bottom-color: var(--red-dim);
  box-shadow: 0 2px 30px rgba(230,0,18,0.1);
}
.navbar .container { display: flex; align-items: center; justify-content: space-between; height: 80px; }

.navbar__brand { display: flex; align-items: center; gap: 16px; text-decoration: none; }

.navbar__logo {
  height: 64px; width: 64px; object-fit: contain;
  filter: drop-shadow(0 0 10px rgba(255,0,51,0.5));
  transition: var(--t-med);
}
.navbar__brand:hover .navbar__logo {
  filter: drop-shadow(0 0 18px rgba(255,0,51,0.8));
  transform: scale(1.05);
}

.navbar__title {
  font-family: var(--font-heading); font-size: 1.2rem; font-weight: 700;
  color: var(--text-primary); letter-spacing: 2px; text-transform: uppercase;
}
.navbar__title span { color: var(--red-bright); text-shadow: 0 0 10px rgba(255,0,51,0.5); }

.navbar__links { display: flex; align-items: center; gap: 8px; list-style: none; }

.navbar__links a {
  font-family: var(--font-body); font-weight: 600; font-size: 1rem;
  color: var(--text-secondary); text-decoration: none; text-transform: uppercase;
  letter-spacing: 1.5px; padding: 8px 18px; border-radius: 4px;
  transition: var(--t-fast); position: relative;
}
.navbar__links a::after {
  content: ''; position: absolute; bottom: 2px; left: 50%;
  width: 0; height: 2px; background: var(--red-bright);
  box-shadow: 0 0 8px var(--red-glow); transition: var(--t-med); transform: translateX(-50%);
}
.navbar__links a:hover { color: var(--text-primary); }
.navbar__links a:hover::after { width: 60%; }
.navbar__links a.active { color: var(--red-bright); }
.navbar__links a.active::after { width: 60%; }

/* ---------- Dropdown ---------- */
.navbar__dropdown { position: relative; }
.navbar__dropdown-toggle { cursor: pointer; user-select: none; }

.navbar__dropdown-menu {
  display: none; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%); list-style: none;
  background: rgba(10,10,10,0.97); backdrop-filter: blur(20px);
  border: 1px solid var(--border-color); border-radius: 6px;
  min-width: 220px; padding: 8px 0; z-index: 1100;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.navbar__dropdown-menu li { list-style: none; }
.navbar__dropdown-menu a {
  display: block; padding: 10px 20px; color: var(--text-secondary);
  text-decoration: none; font-family: var(--font-body); font-weight: 600;
  font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase;
  transition: var(--t-fast); border-radius: 0; white-space: nowrap;
}
.navbar__dropdown-menu a::after { display: none; }
.navbar__dropdown-menu a:hover { color: var(--text-primary); background: rgba(230,0,18,0.08); }
.navbar__dropdown:hover .navbar__dropdown-menu { display: block; }
.navbar__dropdown.open .navbar__dropdown-menu { display: block; }

/* ---------- Hamburger ---------- */
.navbar__hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; border: none; background: none; }
.navbar__hamburger span { display: block; width: 26px; height: 2px; background: var(--text-primary); border-radius: 2px; transition: var(--t-fast); }

/* ============================
   HERO
   ============================ */
.hero {
  position: relative; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding-top: 80px; overflow: hidden;
}
.hero__bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(139,0,0,0.15) 0%, transparent 65%); z-index: 0; }
.hero__content { position: relative; z-index: 1; max-width: 800px; }

.hero__logo {
  width: 300px; height: 300px; object-fit: contain; margin-bottom: 32px;
  filter: drop-shadow(0 0 30px rgba(255,0,51,0.4));
  animation: heroLogoPulse 4s ease-in-out infinite;
}
@keyframes heroLogoPulse {
  0%, 100% { filter: drop-shadow(0 0 30px rgba(255,0,51,0.4)); }
  50% { filter: drop-shadow(0 0 50px rgba(255,0,51,0.7)); }
}

.hero__title {
  font-family: var(--font-heading); font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 900; letter-spacing: 4px; text-transform: uppercase; line-height: 1.2; margin-bottom: 16px;
}
.hero__title .highlight { color: var(--red-bright); text-shadow: 0 0 20px rgba(255,0,51,0.6), 0 0 60px rgba(255,0,51,0.3); }

.hero__subtitle { font-family: var(--font-body); font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 400; color: var(--text-secondary); margin-bottom: 40px; letter-spacing: 1px; }

.hero__cta {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-heading); font-size: 1rem; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase; color: var(--text-primary);
  background: linear-gradient(135deg, var(--red-dark), var(--red-primary));
  border: 1px solid var(--red-primary); padding: 16px 40px; border-radius: 4px;
  cursor: pointer; text-decoration: none; transition: var(--t-med);
  box-shadow: 0 0 20px rgba(230,0,18,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
}
.hero__cta:hover {
  background: linear-gradient(135deg, var(--red-primary), var(--red-bright));
  box-shadow: 0 0 40px rgba(230,0,18,0.4), 0 0 80px rgba(230,0,18,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
  transform: translateY(-2px);
}
.hero__line { width: 120px; height: 2px; margin: 0 auto 24px; background: linear-gradient(90deg, transparent, var(--red-bright), transparent); box-shadow: 0 0 12px var(--red-glow); }

/* ============================
   CATEGORY SECTION
   ============================ */
.category-section { padding: 80px 0 40px; position: relative; z-index: 1; }

.category-section__header { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
.category-section__icon { font-size: 1.6rem; }
.category-section__title { font-family: var(--font-heading); font-size: clamp(1.2rem, 2.5vw, 1.6rem); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-primary); }
.category-section__count { font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; color: var(--text-dim); background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; margin-left: auto; }

/* ============================
   GAMES GRID
   ============================ */
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }

.game-card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
  overflow: hidden; transition: var(--t-med); cursor: pointer; position: relative;
}
.game-card::before {
  content: ''; position: absolute; inset: 0; border-radius: 8px; padding: 1px;
  background: linear-gradient(135deg, transparent 40%, var(--red-dim) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: var(--t-med);
}
.game-card:hover {
  border-color: var(--red-dark); background: var(--bg-card-hover); transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(230,0,18,0.08);
}
.game-card:hover::before { opacity: 1; }

.game-card__image {
  width: 100%; height: 180px; background: linear-gradient(135deg, var(--bg-darkest), var(--bg-dark));
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
}
.game-card__image::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: linear-gradient(to top, var(--bg-card), transparent); }
.game-card__placeholder-icon { font-size: 3rem; opacity: 0.3; }

.game-card__body { padding: 20px; }
.game-card__name { font-family: var(--font-heading); font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; color: var(--text-primary); }
.game-card__path { font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--text-dim); background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 4px; word-break: break-all; margin-bottom: 12px; }
.game-card__status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.game-card__status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red-primary); box-shadow: 0 0 6px var(--red-glow); animation: statusPulse 2s ease-in-out infinite; }
@keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.game-card__status-text { color: var(--red-bright); }

/* ============================
   LOADING / ERROR
   ============================ */
.loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 0; gap: 24px; }
.loading-state__spinner { width: 48px; height: 48px; border: 3px solid var(--border-color); border-top-color: var(--red-primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state__text { font-family: var(--font-body); font-size: 1rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }

.error-state { text-align: center; padding: 80px 24px; }
.error-state__icon { font-size: 3rem; margin-bottom: 16px; }
.error-state__message { font-family: var(--font-body); font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px; }
.error-state__detail { font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--red-primary); background: rgba(230,0,18,0.05); border: 1px solid rgba(230,0,18,0.15); padding: 12px 20px; border-radius: 4px; display: inline-block; }

/* ============================
   FOOTER
   ============================ */
.footer { position: relative; z-index: 1; border-top: 1px solid var(--border-color); padding: 40px 0; text-align: center; }
.footer__brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
.footer__logo { height: 40px; width: 40px; object-fit: contain; opacity: 0.6; }
.footer__name { font-family: var(--font-heading); font-size: 0.9rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); }
.footer__copy { font-size: 0.85rem; color: var(--text-dim); }

/* ============================
   GAME VIEWER OVERLAY
   ============================ */
.game-viewer {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none; visibility: hidden;
}
.game-viewer.active { pointer-events: auto; visibility: visible; }

.game-viewer__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 0.4s ease; }
.game-viewer.active .game-viewer__backdrop { background: rgba(0,0,0,0.8); }

.game-viewer__window {
  position: relative; width: 100%; height: 100%;
  background: var(--bg-darkest); border-top: 2px solid var(--red-primary);
  box-shadow: 0 -10px 60px rgba(230,0,18,0.15);
  transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column;
}
.game-viewer.active .game-viewer__window { transform: translateY(0); }

.game-viewer__toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg-dark); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.game-viewer__game-name { font-family: var(--font-heading); font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-primary); }
.game-viewer__close { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--border-color); color: var(--text-secondary); font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: var(--t-fast); }
.game-viewer__close:hover { border-color: var(--red-primary); color: var(--red-bright); box-shadow: 0 0 12px rgba(230,0,18,0.2); }
.game-viewer__close-icon { font-size: 1.1rem; line-height: 1; }

.game-viewer__iframe-wrapper { flex: 1; position: relative; overflow: hidden; }
.game-viewer__iframe { width: 100%; height: 100%; border: none; background: var(--bg-darkest); }

.game-viewer__loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--bg-darkest); z-index: 2; transition: opacity 0.3s ease; }
.game-viewer__loading.hidden { opacity: 0; pointer-events: none; }
.game-viewer__loading .loading-state__spinner { width: 40px; height: 40px; }
.game-viewer__loading-text { font-family: var(--font-body); font-size: 0.9rem; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }

/* ============================
   RESPONSIVE
   ============================ */
@media (max-width: 768px) {
  .navbar__links { display: none; position: absolute; top: 80px; left: 0; width: 100%; flex-direction: column; background: rgba(5,5,5,0.95); backdrop-filter: blur(20px); padding: 16px; border-bottom: 1px solid var(--border-color); gap: 4px; }
  .navbar__links.open { display: flex; }
  .navbar__links a { width: 100%; text-align: center; padding: 12px 18px; }
  .navbar__hamburger { display: flex; }
  .hero__logo { width: 200px; height: 200px; }
  .games-grid { grid-template-columns: 1fr; }
  .game-viewer__toolbar { padding: 10px 16px; }
  .game-viewer__game-name { font-size: 0.75rem; }
  .category-section__header { flex-wrap: wrap; }
  .category-section__count { margin-left: 0; }

  .navbar__dropdown-menu { position: static; transform: none; border: none; box-shadow: none; background: transparent; padding: 0; min-width: 0; }
  .navbar__dropdown-menu a { padding: 10px 0; font-size: 1rem; }
}

/* ---------- Scroll reveal ---------- */
.fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
.fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>

/* ================================================================
   ENGINE
   ================================================================ */
(function () {
  const CATEGORIES = [
    { id: "games",      label: "Games",     icon: "🎮" },
    { id: "emulators",  label: "Emulators", icon: "🕹️" },
    { id: "browsers",   label: "Browsers",  icon: "🌐" }
  ];

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  // ---- Elements ----
  const navbar         = $('#navbar');
  const navLinks       = $('#navLinks');
  const hamburger      = $('#hamburger');
  const browseBtn      = $('#browseGamesBtn');
  const mainContainer  = $('#mainContent');
  const loadingEl      = $('#loadingState');
  const gameViewer     = $('#gameViewer');
  const viewerBackdrop = $('#viewerBackdrop');
  const viewerClose    = $('#viewerClose');
  const viewerIframe   = $('#viewerIframe');
  const viewerLoading  = $('#viewerLoading');
  const viewerGameName = $('#viewerGameName');

  // ---- Scroll reveal ----
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
  }, { threshold: 0.15 });

  // ---- Navbar scroll effect ----
  window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', scrollY > 40));

  // ---- Hamburger ----
  hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));

  // ---- Browse CTA ----
  browseBtn.addEventListener('click', (e) => {
    e.preventDefault();
    $('#categoriesRoot').scrollIntoView({ behavior: 'smooth' });
  });

  // ---- Viewer open / close ----
  function openGame(name, path) {
    viewerGameName.textContent = name;
    viewerLoading.classList.remove('hidden');
    viewerIframe.src = ''; // Clear previous source

    requestAnimationFrame(() => {
      gameViewer.classList.add('active');
      document.body.style.overflow = 'hidden';

      setTimeout(() => {
        viewerIframe.src = path;

        const revealGame = () => {
          if (!viewerLoading.classList.contains('hidden')) {
            viewerLoading.classList.add('hidden');
          }
        };

        viewerIframe.addEventListener('load', function onIframeLoad() {
          viewerIframe.removeEventListener('load', onIframeLoad);
          try {
            const innerDoc = viewerIframe.contentDocument || viewerIframe.contentWindow.document;
            if (innerDoc.readyState === 'complete' || innerDoc.readyState === 'interactive') {
              revealGame();
            } else {
              innerDoc.addEventListener('DOMContentLoaded', revealGame, { once: true });
            }
          } catch (e) {
            // Fallback to timeout if cross-origin
          }
        });

        // Safety timeout
        setTimeout(revealGame, 3500);
      }, 100);
    });
  }

  function closeGame() {
    gameViewer.classList.remove('active');
    document.body.style.overflow = '';
    // Clear src after animation to stop audio/processing
    setTimeout(() => { viewerIframe.src = ''; viewerLoading.classList.add('hidden'); }, 500);
  }

  viewerClose.addEventListener('click', closeGame);
  viewerBackdrop.addEventListener('click', closeGame);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && gameViewer.classList.contains('active')) closeGame(); });

  // ---- Build HTML ----
  function cardHTML(item, i) {
    const icons = { games: "🎮", emulators: "🕹️", browsers: "🌐" };
    return `<div class="game-card fade-in" style="transition-delay:${i*0.08}s" data-name="${esc(item.name)}" data-path="${esc(item.path)}">
      <div class="game-card__image"><span class="game-card__placeholder-icon">${icons[item.category]||"🎮"}</span></div>
      <div class="game-card__body">
        <h3 class="game-card__name">${esc(item.name)}</h3>
        <div class="game-card__path">${esc(item.path)}</div>
        <div class="game-card__status"><span class="game-card__status-dot"></span><span class="game-card__status-text">Ready</span></div>
      </div>
    </div>`;
  }

  function sectionHTML(cat, items) {
    const cards = items.map((g,i) => cardHTML(g,i)).join('');
    return `<section class="category-section fade-in" id="category-${cat.id}">
      <div class="container">
        <div class="category-section__header">
          <span class="category-section__icon">${cat.icon}</span>
          <h2 class="category-section__title">${cat.label}</h2>
          <span class="category-section__count">${items.length} ${items.length===1?'item':'items'}</span>
        </div>
        <div class="games-grid">${cards}</div>
      </div>
    </section>`;
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ---- Render ----
  function render() {
    const grouped = {};
    CATEGORIES.forEach(c => grouped[c.id] = []);
    GAMES_DATA.forEach(g => { if (grouped[g.category]) grouped[g.category].push(g); });

    mainContainer.innerHTML = CATEGORIES.map(c => sectionHTML(c, grouped[c.id])).join('');
    $$('.fade-in').forEach(el => observer.observe(el));

    $$('.game-card').forEach(card => {
      card.addEventListener('click', () => openGame(card.dataset.name, card.dataset.path));
    });

    if (loadingEl) loadingEl.style.display = 'none';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
})();
  </script>
